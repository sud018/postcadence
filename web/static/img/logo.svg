<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PostCadence" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>PostCadence</title>
  <defs>
    <linearGradient id="pc-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- the tile -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#pc-tile)"/>

  <!-- the dial: a cycle that comes round again, open at the top -->
  <path d="M32 15.5 a16.5 16.5 0 1 1 -14.5 8.6" fill="none" stroke="#fff"
        stroke-width="3.6" stroke-linecap="round" opacity=".45"/>
  <!-- the beat: the moment a post goes out -->
  <circle cx="32" cy="15.5" r="4.6" fill="#fff"/>
  <!-- the cadence: posts stacking up -->
  <rect x="25.5" y="30" width="6" height="12" rx="3" fill="#fff"/>
  <rect x="34.5" y="25" width="6" height="17" rx="3" fill="#fff"/>
</svg>
