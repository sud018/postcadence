name: Post to LinkedIn

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Which slot to post (blank = first configured time)"
        required: false
        default: ""
      dry_run:
        description: "Generate the post but do not publish"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python -m agent run \
            --slot "${{ inputs.slot }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save state back to the repo
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "postcadence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "chore: update posting state [skip ci]"
          git push