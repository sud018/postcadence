name: Post to LinkedIn

on:
  schedule:
    # Generated from data/config.json - edit your schedule in the app.
    - cron: "20 0 * * *"
    - cron: "50 0 * * *"
    - cron: "30 15 * * *"
    - cron: "0 16 * * *"
    - cron: "30 16 * * *"
    - cron: "0 17 * * *"
    - cron: "20 23 * * *"
    - cron: "50 23 * * *"

  workflow_dispatch:
    # The same job, reachable on demand. An outside scheduler calls this when
    # GitHub's own cron runs late; see "Punctuality" in the README.
    # (This comment lives below the key on purpose: anything between the cron
    # block and here is erased when the app rewrites the schedule.)
    inputs:
      mode:
        description: "due = whatever is owed right now (what the schedule does). slot = one specific time."
        type: choice
        options: [due, slot]
        default: due
      slot:
        description: "mode=slot only. Which posting time (blank = the first one configured)."
        required: false
        default: ""
      dry_run:
        description: "Write the post but publish nothing"
        type: boolean
        default: false
      force:
        description: "mode=slot only. Post even if that slot was already handled."
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # GitHub's own cron and an outside scheduler must behave identically, so
      # they share one step. Anything that reads only one of them is a bug
      # waiting for the day you switch over.
      - name: Run due slots
        if: github.event_name == 'schedule' || inputs.mode == 'due'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m agent run-due ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Run one slot
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'slot'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m agent run \
            --slot "${{ inputs.slot }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Save state back to the repo
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: |
          git config user.name "postcadence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "chore: update posting state [skip ci]"
          git push