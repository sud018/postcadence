[project]
name = "postcadence"
dynamic = ["version"]            # read from agent/__init__.py - one place to bump it
description = "Writes and publishes your LinkedIn posts on a schedule."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "keyring>=25",
    "rich>=13",
    "questionary>=2",
    "tzdata>=2024.1",
    "requests>=2.32",
    "openai>=1.40",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pynacl>=1.5",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
postcadence = "agent.cli:main"          # the command-line agent
postcadence-web = "web.__main__:main"   # the local app in your browser

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "agent.cli", "agent.github", "agent.llm", "agent.linkedin", "agent.topics", "web", "web.routers"]

# Templates, CSS and JS are not Python, so setuptools leaves them out unless told.
# Without this, "pip install ." gives an app with no pages.
[tool.setuptools.package-data]
web = ["templates/*.html", "templates/pages/*.html", "templates/partials/*.html",
       "static/css/*", "static/js/*", "static/img/*"]

[tool.setuptools.dynamic]
version = {attr = "agent.__version__"}

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's documented style is Depends()/File()/Form() in argument defaults.
"web/routers/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
