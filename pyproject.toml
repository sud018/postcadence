[project]
name = "postcadence"
version = "0.1.0"
description = "Writes and publishes your LinkedIn posts on a schedule."
requires-python = ">=3.10"
dependencies = [
    "keyring>=25",
    "rich>=13",
    "questionary>=2",
    "tzdata>=2024.1",
    "requests>=2.32",
    "openai>=1.40",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
postcadence = "agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "agent.cli", "agent.llm", "agent.linkedin", "agent.topics", "web", "web.routers"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
